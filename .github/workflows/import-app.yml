name: Import application source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ hashFiles('.upload/ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and import application
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/store-accountability-manager.zip
          for part in .upload/part-*.b64; do
            base64 --decode "$part" >> /tmp/store-accountability-manager.zip
          done
          mkdir -p /tmp/store-accountability-manager
          unzip -q /tmp/store-accountability-manager.zip -d /tmp/store-accountability-manager
          test -f /tmp/store-accountability-manager/store-accountability-manager/package.json

          rm -rf .upload
          cp -a /tmp/store-accountability-manager/store-accountability-manager/. .
          rm -f .github/workflows/import-app.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Store Accountability Manager app"
          git push
